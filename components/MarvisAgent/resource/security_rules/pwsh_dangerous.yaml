# PowerShell 危险命令检测规则
# 类别：RCE（代码下载执行）、NET（网络出网）
# 匹配默认 case-insensitive

rules:
  # ============================================================
  # RCE: 代码下载执行
  # ============================================================

  - id: RCE-001
    category: RCE
    category_name: 代码下载执行
    description: 从远程地址下载脚本并直接执行，是典型的远程代码执行模式。
    pattern: '(iwr|Invoke-WebRequest|irm|Invoke-RestMethod)\s+.+\|\s*(iex|Invoke-Expression)'

  - id: RCE-002
    category: RCE
    category_name: 代码下载执行
    description: 从远程地址下载脚本并直接执行，是典型的远程代码执行模式。
    pattern: '(New-Object\s+Net\.WebClient)\s*\)?\s*\.Download(String|File|Data)\s*\(.+\)\s*\|\s*(iex|Invoke-Expression)'

  - id: RCE-003
    category: RCE
    category_name: 代码下载执行
    description: 直接执行从远程下载的脚本内容。
    pattern: '(iex|Invoke-Expression)\s*\(\s*(iwr|Invoke-WebRequest|irm|Invoke-RestMethod)\s+'

  - id: RCE-004
    category: RCE
    category_name: 代码下载执行
    description: 直接执行从远程下载的脚本内容。
    pattern: '(iex|Invoke-Expression)\s*\(\s*\(?\s*New-Object\s+Net\.WebClient\s*\)\s*\.Download(String|Data)\s*\('

  - id: RCE-005
    category: RCE
    category_name: 代码下载执行
    description: 通过 Windows 后台传输服务下载文件并执行，可能用于规避检测。
    pattern: 'Start-BitsTransfer\s+.+;\s*.*(iex|Invoke-Expression|&\s|\.\\)'

  # ============================================================
  # NET: 网络出网
  # ============================================================

  - id: NET-003
    category: NET
    category_name: 网络出网
    description: 创建网络客户端对象，可能用于下载远程内容或数据外传。
    pattern: 'New-Object\s+(System\.)?Net\.WebClient'

  - id: NET-004
    category: NET
    category_name: 网络出网
    description: 创建网络客户端对象，可能用于发起网络请求。
    pattern: 'New-Object\s+(System\.)?Net\.Http\.HttpClient'

  - id: NET-005
    category: NET
    category_name: 网络出网
    description: 建立原始 TCP 连接，可能用于反弹 shell 或数据外传。
    pattern: 'New-Object\s+(System\.)?Net\.Sockets\.TcpClient'

  - id: NET-008
    category: NET
    category_name: 网络出网
    description: 发起网络请求，可能用于数据外传或下载远程内容。
    pattern: '\[System\.Net\.(Http)?WebRequest\]::Create\s*\('

  - id: NET-009
    category: NET
    category_name: 网络出网
    description: 发起网络请求，可能用于数据外传或下载远程内容。
    pattern: '\[System\.Net\.HttpWebRequest\]'

  - id: NET-010
    category: NET
    category_name: 网络出网
    description: 借助系统工具下载远程文件，可能用于规避检测。
    pattern: 'certutil\s+.*-urlcache\s+.*-split\s+.*https?://'

  - id: NET-011
    category: NET
    category_name: 网络出网
    description: 通过 HTTP 上传本地文件内容，可能用于数据外传。
    pattern: '(iwr|Invoke-WebRequest|irm|Invoke-RestMethod|curl\.exe)\s+.*(-InFile\s+|--data-binary\s+@|--upload-file\s+|-F\s+["\x27]?[a-zA-Z_]+=@|-d\s+@)'

  # ============================================================
  # DEL: 文件删除
  # ============================================================

  - id: DEL-001
    category: DEL
    category_name: 文件删除
    description: 递归删除目录及其内容，可能导致大量文件不可恢复地丢失。
    pattern: '\b(Remove-Item|rm|del|ri|rd|rmdir|erase)\b.*-Recurse'
    severity: critical

  - id: DEL-002
    category: DEL
    category_name: 文件删除
    description: 强制删除文件或目录（跳过确认），可能误删重要数据。
    pattern: '\b(Remove-Item|rm|del|ri|rd|rmdir|erase)\b.*-Force'

  - id: DEL-003
    category: DEL
    category_name: 文件删除
    description: 使用通配符批量删除，影响范围可能超出预期。
    pattern: '\b(Remove-Item|rm|del|ri|rd|rmdir|erase)\b\s+.*(\\\*|\*\.\*|-Path\s+\*)'

  - id: DEL-004
    category: DEL
    category_name: 文件删除
    description: 使用 CMD rd/rmdir 递归删除目录，整个目录树将被不可恢复地删除。
    pattern: '\b(rd|rmdir)\s+/s'
    severity: critical

  - id: DEL-005
    category: DEL
    category_name: 文件删除
    description: 使用 CMD del 批量删除文件（/s 递归子目录，/q 静默无确认）。
    pattern: '\bdel\s+/[sfq]'
    severity: critical

  - id: DEL-006
    category: DEL
    category_name: 文件删除
    description: 格式化磁盘卷，将擦除目标分区上的所有数据。
    pattern: '\bFormat-Volume\b'

  - id: DEL-007
    category: DEL
    category_name: 文件删除
    description: 清除磁盘数据或初始化磁盘，将导致整块磁盘数据不可恢复。
    pattern: '\b(Clear-Disk|Initialize-Disk)\b'

  - id: DEL-008
    category: DEL
    category_name: 文件删除
    description: git clean 将永久删除未跟踪的文件和目录，无法通过 git 恢复。
    pattern: 'git\s+clean\s+-[fdxX]'

  - id: DEL-009
    category: DEL
    category_name: 文件删除
    description: git reset --hard 将丢弃所有未提交的更改（暂存和工作区），不可恢复。
    pattern: 'git\s+reset\s+--hard'

  - id: DEL-010
    category: DEL
    category_name: 文件删除
    description: git checkout -- 将丢弃工作区文件更改，未提交的修改将不可恢复。
    pattern: 'git\s+checkout\s+--\s'

  # --- 高危路径删除“护栏”（仅 Windows 用户内容目录前缀） ---

  - id: DEL-011
    category: DEL
    category_name: 文件删除
    description: Remove-Item 携 -Force -Recurse 递归删除位于用户家目录下重要子目录（Desktop/Documents/Downloads 等）的内容，以往事故高发，需改派 delete 工具走回收站。
    # 双交差匹配：同时包含 -Recurse + -Force 两个参数（参数顺序任意）
    # AND 路径含字面 C:\Users\<name>\<重要子目录> 或 $env:USERPROFILE/$env:HOME/$HOME/%USERPROFILE% 变量开头 （由 shell_scanner 展开后再扫）
    # 用户名支持中文 [\w\u4e00-\u9fa5]+；盘符大小写不敏感；分隔符 \ 与 / 等价
    # 禁止误命中 C:\Windows\、C:\Program Files\、C:\ProgramData\ 等系统目录
    pattern: '\b(Remove-Item|ri)\b(?=[^\n;|&]*-Recurse)(?=[^\n;|&]*-Force)[^\n;|&]*?(?:["''](?:[a-zA-Z]:[\\/]Users[\\/][\w\u4e00-\u9fa5][\w\u4e00-\u9fa5\.\-]*[\\/](?:Desktop|Documents|Downloads|Pictures|Music|Videos|Projects|Code|Work)|\$env:(?:USERPROFILE|HOME)[\\/]|\$HOME[\\/]|%USERPROFILE%[\\/])|(?:[a-zA-Z]:[\\/]Users[\\/][\w\u4e00-\u9fa5][\w\u4e00-\u9fa5\.\-]*[\\/](?:Desktop|Documents|Downloads|Pictures|Music|Videos|Projects|Code|Work)|\$env:(?:USERPROFILE|HOME)[\\/]|\$HOME[\\/]|%USERPROFILE%[\\/]))'
    severity: critical
