[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mac-use-mcp"
version = "2.0.1"
description = "macOS platform package for sys-use-mcp"
requires-python = ">=3.11"
dependencies = [
    "sys-use-mcp-core>=1.0,<2.0",
    "dooti>=0.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
mac-use-mcp = "mac_use_mcp.__main__:main"

[project.entry-points."sys_use_mcp.toolkit"]
mac = "mac_use_mcp.toolkit_loader:register_all"

[tool.setuptools.packages.find]
where = ["."]
include = ["mac_use_mcp*"]

[tool.uv.sources]
sys-use-mcp-core = { workspace = true }
