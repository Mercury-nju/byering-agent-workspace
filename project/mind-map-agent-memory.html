<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>主 Agent 与子 Agent · 记忆逻辑</title>
  <style>
    :root {
      --ink: #20242b;
      --muted: #7c8795;
      --line: #cbd4df;
      --canvas: #ffffff;
      --page: #f5f7fa;
      --blue: #1677ff;
      --blue-soft: #eaf3ff;
      --green: #18a66b;
      --green-soft: #eaf8f2;
      --orange: #dc8a25;
      --orange-soft: #fff4e6;
      --purple: #7861d8;
      --purple-soft: #f2efff;
      --red: #ce5a57;
      --red-soft: #fff0ef;
      --slate: #5a718e;
      --slate-soft: #edf3f8;
      --shadow: 0 18px 60px rgba(40, 58, 78, .08);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }

    .shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 24px;
      gap: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 64px;
      padding: 0 4px;
    }

    .heading { display: flex; align-items: baseline; gap: 14px; }
    h1 { margin: 0; font-size: 23px; letter-spacing: 0; font-weight: 760; }
    .subtitle { color: var(--muted); font-size: 13px; }

    .controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .control-group {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px;
      border: 1px solid #e4e9ef;
      border-radius: 10px;
      background: rgba(255,255,255,.8);
    }
    button, input {
      font: inherit;
      color: inherit;
    }
    button {
      border: 0;
      background: transparent;
      cursor: pointer;
    }
    .icon-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      color: #687687;
      font-size: 18px;
      transition: background .18s ease, color .18s ease;
    }
    .icon-btn:hover { background: #eef2f6; color: var(--ink); }
    .text-btn {
      height: 32px;
      padding: 0 10px;
      border-radius: 7px;
      color: #536272;
      font-size: 12px;
      white-space: nowrap;
      transition: background .18s ease, color .18s ease;
    }
    .text-btn:hover { background: #eef2f6; color: var(--ink); }
    .search {
      width: 178px;
      height: 40px;
      padding: 0 12px;
      border: 1px solid #dfe6ed;
      border-radius: 10px;
      outline: none;
      background: #fff;
      font-size: 13px;
    }
    .search:focus { border-color: #a7c8ff; box-shadow: 0 0 0 3px rgba(22,119,255,.1); }

    .map-frame {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
      border: 1px solid #e5eaf0;
      border-radius: 16px;
      background: var(--canvas);
      box-shadow: var(--shadow);
    }
    .map-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background-image: radial-gradient(#dce3eb .7px, transparent .7px);
      background-size: 18px 18px;
      mask-image: linear-gradient(to bottom, rgba(0,0,0,.22), transparent 75%);
    }
    .viewport {
      position: absolute;
      inset: 0;
      overflow: auto;
      cursor: grab;
      scrollbar-color: #d3dbe5 transparent;
    }
    .viewport:active { cursor: grabbing; }
    svg {
      display: block;
      width: 1800px;
      height: 1120px;
      transform-origin: 0 0;
      transition: transform .24s ease;
    }
    .edge {
      fill: none;
      stroke: var(--line);
      stroke-width: 2;
      stroke-linecap: round;
      transition: opacity .2s ease;
    }
    .edge.edge-primary { stroke-width: 2.5; }
    .edge.is-dim, .node.is-dim { opacity: .12; }
    .node { cursor: pointer; transition: opacity .2s ease; }
    .node rect { stroke-width: 1.3; transition: filter .18s ease, stroke .18s ease; }
    .node:hover rect { filter: drop-shadow(0 7px 12px rgba(38, 54, 73, .13)); }
    .node text { pointer-events: none; dominant-baseline: middle; }
    .node .node-title { font-size: 16px; font-weight: 700; }
    .node .node-detail { font-size: 12px; fill: var(--muted); }
    .node.root rect { fill: var(--blue); stroke: var(--blue); }
    .node.root .node-title { fill: #fff; font-size: 20px; }
    .node.branch-blue rect { fill: var(--blue-soft); stroke: #a9ccff; }
    .node.branch-green rect { fill: var(--green-soft); stroke: #a8dfc6; }
    .node.branch-orange rect { fill: var(--orange-soft); stroke: #f1c98f; }
    .node.branch-purple rect { fill: var(--purple-soft); stroke: #c8bdf4; }
    .node.branch-red rect { fill: var(--red-soft); stroke: #efbbb8; }
    .node.branch-slate rect { fill: var(--slate-soft); stroke: #b8cadb; }
    .node.leaf rect { fill: #fff; stroke: #dce4ec; }
    .node.leaf .node-title { font-size: 13px; font-weight: 650; }
    .node.leaf .node-detail { font-size: 11px; }
    .node.collapsed .collapse-mark { textContent: "＋"; }
    .collapse-mark { fill: #8492a2; font-size: 14px; font-weight: 700; }
    .highlight rect { stroke: var(--blue) !important; stroke-width: 2.5 !important; }
    .highlight .node-title { fill: var(--blue); }

    .legend {
      position: absolute;
      left: 20px;
      bottom: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      border: 1px solid #e7edf2;
      border-radius: 10px;
      background: rgba(255,255,255,.9);
      color: #6b7887;
      font-size: 11px;
      backdrop-filter: blur(8px);
    }
    .legend span { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .dot.blue { background: var(--blue); }
    .dot.green { background: var(--green); }
    .dot.orange { background: var(--orange); }
    .dot.purple { background: var(--purple); }
    .dot.red { background: var(--red); }

    .hint {
      position: absolute;
      right: 20px;
      bottom: 18px;
      color: #9aa6b4;
      font-size: 11px;
      pointer-events: none;
    }

    @media (max-width: 760px) {
      .shell { padding: 14px; gap: 10px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .controls { width: 100%; justify-content: flex-start; }
      .search { flex: 1; min-width: 140px; }
      .subtitle { display: none; }
      .legend { left: 12px; bottom: 12px; gap: 8px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="heading">
        <h1>主 Agent 与子 Agent · 记忆逻辑</h1>
        <span class="subtitle">看懂谁记住什么、什么时候写入、谁可以读取</span>
      </div>
      <div class="controls">
        <input id="search" class="search" type="search" placeholder="搜索节点内容" aria-label="搜索节点内容" />
        <div class="control-group" aria-label="缩放控制">
          <button class="icon-btn" id="zoomOut" title="缩小" aria-label="缩小">−</button>
          <button class="text-btn" id="zoomReset" title="重置视图">100%</button>
          <button class="icon-btn" id="zoomIn" title="放大" aria-label="放大">＋</button>
        </div>
        <div class="control-group">
          <button class="text-btn" id="expandAll">展开全部</button>
          <button class="text-btn" id="collapseAll">收起分支</button>
        </div>
      </div>
    </header>

    <section class="map-frame" aria-label="主 Agent 与子 Agent 记忆逻辑思维导图">
      <div class="viewport" id="viewport">
        <svg id="mindMap" viewBox="0 0 1680 1120" role="img" aria-labelledby="mapTitle mapDesc">
          <title id="mapTitle">主 Agent 与子 Agent 的记忆逻辑</title>
      <desc id="mapDesc">从记忆分类、写入、读取、共享、生命周期和主子 Agent 差异六个方向展开，用直接的业务语言解释每条规则。</desc>
          <g id="edges"></g>
          <g id="nodes"></g>
        </svg>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i class="dot blue"></i>基础规则</span>
        <span><i class="dot green"></i>主 Agent</span>
        <span><i class="dot orange"></i>子 Agent</span>
        <span><i class="dot purple"></i>共享边界</span>
        <span><i class="dot red"></i>安全控制</span>
      </div>
      <div class="hint">点击节点查看细节 · 滚轮缩放 · 拖动画布</div>
    </section>
  </main>

  <script>
    const tree = {
      id: "root",
      title: "Agent 记忆系统",
      detail: "让 Agent 记住有用信息，但不会把所有聊天都永久保存",
      kind: "root",
      children: [
        {
          id: "types", title: "记忆分类", detail: "先判断这条信息属于谁，以及以后会影响哪些任务", kind: "branch-blue",
          children: [
            { id: "org", title: "组织级", detail: "所有 Agent 都必须遵守的公司规则，例如不能私自承诺退款" },
            { id: "project", title: "项目级", detail: "同一个项目里持续有效的目标、地区和执行方式" },
            { id: "agent", title: "Agent 级", detail: "某个专业 Agent 自己积累的方法和工作偏好" },
            { id: "task", title: "任务级", detail: "只对本次任务有效的条件，任务结束后通常不再使用" },
            { id: "lead", title: "客户 / 线索级", detail: "某个账号的公开资料、需求信号和沟通记录" }
          ]
        },
        {
          id: "write", title: "记忆写入", detail: "只有明确、有依据、以后还会有用的信息才会保存", kind: "branch-green",
          children: [
            { id: "explicit", title: "用户明确要求", detail: "用户说‘以后都这样’，系统才会把它当作长期规则" },
            { id: "correction", title: "用户主动纠正", detail: "用户指出旧判断错误，系统更新旧规则而不是继续叠加" },
            { id: "evidence", title: "检查事实依据", detail: "当前消息或任务结果必须能证明这条记忆不是猜测" },
            { id: "scope", title: "确定影响范围", detail: "判断它只影响本次任务，还是会影响项目或所有工作" },
            { id: "proposal", title: "先形成待确认项", detail: "不确定的长期偏好先等用户确认，避免系统自作主张" }
          ]
        },
        {
          id: "read", title: "记忆读取", detail: "每次工作只带入与当前问题最相关的几条信息", kind: "branch-orange",
          children: [
            { id: "context", title: "先确定工作场景", detail: "先确认当前用户、项目、任务、账号和负责的 Agent" },
            { id: "match", title: "只读取相关范围", detail: "优先读取当前任务和项目规则，不把无关历史带进来" },
            { id: "rank", title: "按重要程度排序", detail: "越符合当前问题、越明确、越新的记忆越优先使用" },
            { id: "priority", title: "处理规则冲突", detail: "用户这次明确说的话，优先于过去保存的习惯" },
            { id: "budget", title: "限制带入数量", detail: "只带入最有用的几条，避免旧信息干扰当前判断" }
          ]
        },
        {
          id: "share", title: "主子共享", detail: "只把完成下一步所需的信息交给对应 Agent", kind: "branch-purple",
          children: [
            { id: "shared-auto", title: "自动共享", detail: "所有相关 Agent 都需要知道的项目目标和安全规则" },
            { id: "shared-control", title: "经过筛选再共享", detail: "只有后续工作需要时，才传递研究结论和风险判断" },
            { id: "private", title: "默认不共享", detail: "其他任务、无关客户和未确认的内部推断不自动传递" },
            { id: "main-private", title: "主 Agent 私有", detail: "幕僚长保存用户长期偏好和跨任务工作方式" },
            { id: "sub-private", title: "子 Agent 私有", detail: "专业 Agent 保存自己的方法和当前环节的工作上下文" }
          ]
        },
        {
          id: "lifecycle", title: "生命周期", detail: "记忆会生效、更新、过期或被用户删除", kind: "branch-red",
          children: [
            { id: "active", title: "有效", detail: "当前仍然适用，默认会参与后续相关判断" },
            { id: "temporary", title: "临时记忆", detail: "只在本次任务或指定时间内有效，到期后自动停止使用" },
            { id: "archive", title: "归档", detail: "保留历史记录，但默认不会再影响 Agent 的回答" },
            { id: "forget", title: "删除 / 忘记", detail: "用户要求忘记后，系统停止使用这条记忆" },
            { id: "rollback", title: "恢复 / 回滚", detail: "误删或改错时，可以恢复之前的版本" }
          ]
        },
        {
          id: "difference", title: "主子差异", detail: "使用同一套记忆规则，但负责的事情不同", kind: "branch-slate",
          children: [
            { id: "main-role", title: "主 Agent 记住什么", detail: "记住用户和项目以后应该怎样工作，以及全局风险边界" },
            { id: "sub-role", title: "子 Agent 记住什么", detail: "记住自己负责的专业方法、反馈和当前执行要求" },
            { id: "main-act", title: "主 Agent 用记忆做什么", detail: "减少重复沟通，安排任务，并保持不同任务之间的连续性" },
            { id: "sub-act", title: "子 Agent 用记忆做什么", detail: "提高找人、分析、研究或触达等具体环节的准确度" },
            { id: "boundary", title: "所有 Agent 的底线", detail: "记忆不能突破账号授权、用户审批和数据权限" }
          ]
        }
      ]
    };

    const svg = document.getElementById("mindMap");
    const edgeLayer = document.getElementById("edges");
    const nodeLayer = document.getElementById("nodes");
    const search = document.getElementById("search");
    const zoomReset = document.getElementById("zoomReset");
    const viewport = document.getElementById("viewport");
    let zoom = 1;
    const collapsed = new Set();
    const positions = new Map();
    const nodes = new Map();

    const escapeXml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&apos;" }[char]));
    const visibleChildren = (node) => collapsed.has(node.id) ? [] : (node.children || []);

    function collect(node, level = 0, result = []) {
      result.push({ node, level });
      visibleChildren(node).forEach((child) => collect(child, level + 1, result));
      return result;
    }

    function layout() {
      positions.clear();
      nodes.clear();
      const levelX = [84, 390, 730, 1120];
      const branchGap = 18;
      let cursor = 84;

      function place(node, level, parent = null) {
        const children = visibleChildren(node);
        if (!children.length) {
          const metrics = nodeMetrics(node);
          const height = metrics.height;
          const y = cursor + height / 2;
          cursor += height + branchGap;
          positions.set(node.id, { x: levelX[Math.min(level, levelX.length - 1)], y, ...metrics });
          nodes.set(node.id, node);
          return y;
        }

        const childYs = children.map((child) => place(child, level + 1, node));
        const y = (childYs[0] + childYs[childYs.length - 1]) / 2;
        const metrics = nodeMetrics(node);
        positions.set(node.id, { x: levelX[Math.min(level, levelX.length - 1)], y, ...metrics });
        nodes.set(node.id, node);
        return y;
      }

      place(tree, 0);
      const maxY = Math.max(1120, cursor + 42);
      svg.setAttribute("height", maxY);
      svg.setAttribute("viewBox", `0 0 1800 ${maxY}`);
    }

    function wrapDetail(detail, maxChars) {
      const text = String(detail || "");
      if (!text) return [];
      const lines = [];
      for (let index = 0; index < text.length; index += maxChars) {
        lines.push(text.slice(index, index + maxChars));
      }
      return lines.slice(0, 2);
    }

    function nodeMetrics(node) {
      const isRoot = node.kind === "root";
      const isBranch = Boolean(node.kind && node.kind !== "root");
      const width = isRoot ? 260 : (isBranch ? 286 : 300);
      const lines = wrapDetail(node.detail, isRoot ? 22 : 22);
      const height = isRoot ? 82 : 76 + Math.max(0, lines.length - 1) * 12;
      return { width, height, detailLines: lines };
    }

    function drawEdges(node) {
      const parentPos = positions.get(node.id);
      if (!parentPos) return;
      visibleChildren(node).forEach((child) => {
        const childPos = positions.get(child.id);
        if (!childPos) return;
        const startX = parentPos.x + parentPos.width;
        const endX = childPos.x;
        const bend = Math.max(34, (endX - startX) * .48);
        const d = `M ${startX} ${parentPos.y} C ${startX + bend} ${parentPos.y}, ${endX - bend} ${childPos.y}, ${endX} ${childPos.y}`;
        const primary = node.kind === "root" ? " edge-primary" : "";
        edgeLayer.insertAdjacentHTML("beforeend", `<path class="edge${primary}" data-edge-from="${child.id}" d="${d}"/>`);
        drawEdges(child);
      });
    }

    function drawNode(node) {
      const pos = positions.get(node.id);
      if (!pos) return;
      const hasChildren = Boolean(node.children?.length);
      const isCollapsed = collapsed.has(node.id);
      const label = hasChildren ? (isCollapsed ? "＋" : "−") : "";
      const titleY = node.detail ? pos.y - (pos.detailLines.length > 1 ? 17 : 10) : pos.y;
      const detailY = titleY + 23;
      const className = ["node", node.kind || "leaf", isCollapsed ? "collapsed" : ""].join(" ");
      const titleX = pos.x + 16;
      const detailX = pos.x + 16;
      const detailMarkup = pos.detailLines.map((line, index) => `<tspan x="${detailX}" dy="${index === 0 ? 0 : 14}">${escapeXml(line)}</tspan>`).join("");
      nodeLayer.insertAdjacentHTML("beforeend", `
        <g class="${className}" data-node-id="${node.id}" tabindex="0" role="button" aria-label="${escapeXml(node.title)}${node.detail ? `：${escapeXml(node.detail)}` : ""}">
          <rect x="${pos.x}" y="${pos.y - pos.height / 2}" width="${pos.width}" height="${pos.height}" rx="${node.kind === "root" ? 10 : 9}" />
          <text class="node-title" x="${titleX}" y="${titleY}">${escapeXml(node.title)}</text>
          ${node.detail ? `<text class="node-detail" x="${detailX}" y="${detailY}">${detailMarkup}</text>` : ""}
          ${label ? `<text class="collapse-mark" x="${pos.x + pos.width - 18}" y="${pos.y}">${label}</text>` : ""}
        </g>`);
      nodes.set(node.id, node);
      visibleChildren(node).forEach(drawNode);
    }

    function render() {
      layout();
      edgeLayer.innerHTML = "";
      nodeLayer.innerHTML = "";
      drawEdges(tree);
      drawNode(tree);
      applySearch(search.value.trim());
    }

    function applySearch(query) {
      const normalized = query.toLowerCase();
      document.querySelectorAll(".node, .edge").forEach((element) => {
        element.classList.remove("is-dim", "highlight");
      });
      if (!normalized) return;
      const matched = new Set();
      nodes.forEach((node, id) => {
        if (`${node.title} ${node.detail || ""}`.toLowerCase().includes(normalized)) matched.add(id);
      });
      document.querySelectorAll(".node").forEach((element) => {
        const id = element.dataset.nodeId;
        if (matched.has(id)) element.classList.add("highlight");
        else element.classList.add("is-dim");
      });
      document.querySelectorAll(".edge").forEach((element) => {
        if (!matched.has(element.dataset.edgeFrom)) element.classList.add("is-dim");
      });
    }

    function setZoom(next) {
      zoom = Math.min(1.45, Math.max(.62, next));
      svg.style.transform = `scale(${zoom})`;
      zoomReset.textContent = `${Math.round(zoom * 100)}%`;
    }

    nodeLayer.addEventListener("click", (event) => {
      const node = event.target.closest(".node");
      if (!node || !nodes.get(node.dataset.nodeId)?.children?.length) return;
      const id = node.dataset.nodeId;
      collapsed.has(id) ? collapsed.delete(id) : collapsed.add(id);
      render();
    });
    nodeLayer.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" && event.key !== " ") return;
      event.preventDefault();
      event.target.click();
    });
    search.addEventListener("input", () => applySearch(search.value.trim()));
    document.getElementById("zoomIn").addEventListener("click", () => setZoom(zoom + .1));
    document.getElementById("zoomOut").addEventListener("click", () => setZoom(zoom - .1));
    document.getElementById("zoomReset").addEventListener("click", () => setZoom(1));
    document.getElementById("expandAll").addEventListener("click", () => { collapsed.clear(); render(); });
    document.getElementById("collapseAll").addEventListener("click", () => {
      collapsed.clear();
      tree.children.forEach((branch) => collapsed.add(branch.id));
      render();
    });

    let dragging = false;
    let startX = 0;
    let startY = 0;
    let scrollLeft = 0;
    let scrollTop = 0;
    viewport.addEventListener("pointerdown", (event) => {
      if (event.target.closest(".node")) return;
      dragging = true;
      viewport.setPointerCapture(event.pointerId);
      startX = event.clientX;
      startY = event.clientY;
      scrollLeft = viewport.scrollLeft;
      scrollTop = viewport.scrollTop;
    });
    viewport.addEventListener("pointermove", (event) => {
      if (!dragging) return;
      viewport.scrollLeft = scrollLeft - (event.clientX - startX);
      viewport.scrollTop = scrollTop - (event.clientY - startY);
    });
    viewport.addEventListener("pointerup", () => { dragging = false; });
    viewport.addEventListener("pointercancel", () => { dragging = false; });
    viewport.addEventListener("wheel", (event) => {
      if (!event.ctrlKey && Math.abs(event.deltaY) < 2) return;
      event.preventDefault();
      setZoom(zoom + (event.deltaY < 0 ? .05 : -.05));
    }, { passive: false });

    render();
    setZoom(1);
    requestAnimationFrame(() => {
      viewport.scrollLeft = 0;
      viewport.scrollTop = Math.max(0, (viewport.scrollHeight - viewport.clientHeight) / 2 - 120);
    });
  </script>
</body>
</html>
