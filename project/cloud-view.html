<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>云电脑</title>
  <script>
    document.documentElement.dataset.embedded = new URLSearchParams(location.search).get("embedded") === "1" ? "1" : "0";
  </script>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #070912; color: #eaedf6; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #070912; }
    body { display: flex; flex-direction: column; }
    header { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 16px; flex: none; border-bottom: 1px solid rgba(255,255,255,.1); background: #111522; font-size: 14px; }
    html[data-embedded="1"] header { display: none; }
    .title { font-weight: 600; }
    .status { padding: 3px 8px; border-radius: 5px; color: #aeb6cc; background: rgba(255,255,255,.08); font-size: 12px; }
    .status.pending { color: #f5c66d; background: rgba(245,198,109,.13); }
    .status.success { color: #9de4a8; background: rgba(87,178,106,.15); }
    .status.error { color: #ffaaa7; background: rgba(208,77,70,.18); }
    .toolbar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
    .toolbar span { color: #aeb6cc; font-variant-numeric: tabular-nums; }
    button { height: 28px; padding: 0 10px; border: 1px solid rgba(255,255,255,.14); border-radius: 6px; color: #dfe4f2; background: rgba(255,255,255,.04); font: inherit; font-size: 12px; cursor: pointer; }
    button:hover:not(:disabled) { background: rgba(255,255,255,.1); }
    button:disabled { cursor: not-allowed; opacity: .4; }
    main { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #111522; }
    #screen { width: 100%; height: 100%; outline: none; }
    #screen canvas { display: block; margin: auto; }
    .message { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; pointer-events: none; }
    .message[hidden] { display: none; }
    .message-card { max-width: 430px; padding: 24px; border: 1px solid rgba(255,255,255,.1); border-radius: 10px; background: rgba(17,21,34,.94); }
    .message-card strong { display: block; font-size: 18px; }
    .message-card p { margin: 9px 0 0; color: #9aa3ba; font-size: 13px; line-height: 1.6; }
    #message-reconnect { pointer-events: auto; margin-top: 16px; min-height: 36px; }
  </style>
</head>
<body>
  <header>
    <span class="title">云端沙箱</span>
    <span id="status" class="status pending">连接中</span>
    <div class="toolbar">
      <span id="expiry">画面链接准备中</span>
      <button id="disconnect" type="button" disabled>断开</button>
      <button id="reconnect" type="button">重新连接</button>
      <button id="fullscreen" type="button" aria-label="全屏云电脑" title="全屏云电脑">⛶</button>
    </div>
  </header>
  <main>
    <div id="screen" tabindex="0" aria-label="云电脑画面"></div>
    <div id="message" class="message" hidden>
      <div class="message-card">
        <strong id="message-title"></strong>
        <p id="message-copy"></p>
        <button id="message-reconnect" type="button" hidden>重新连接</button>
      </div>
    </div>
  </main>
  <script type="module" src="./src/salebuddy/ui/cloud-view.js"></script>
</body>
</html>
